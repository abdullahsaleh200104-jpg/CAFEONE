*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.6;padding-bottom:84px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px}

ol.ph{list-style:none;margin:0;padding:0;counter-reset:p}

ol.ph li:last-child{border:0}
ol.ph li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:13px;font-weight:600}
ol.ph li.done{color:var(--ink);font-weight:600}
ol.ph li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--br);color:var(--brt);border-color:var(--br)}
.chip.add{border-style:dashed;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600}

.item .pr b{font-size:18px;font-weight:800;display:block}

.btn{background:var(--br);color:var(--brt);border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.ac{background:var(--ac);color:var(--act)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.danger{background:var(--dg);color:#fff}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:110px;direction:ltr;font-size:13px}
label{display:block;margin-bottom:10px;font-size:14px;color:var(--mut)}
label input,label select{margin-top:4px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--br);font-weight:800}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--sf);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 12px}
#toast{position:fixed;top:auto;right:auto;margin:0;border:0;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.th{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--bg);flex:none}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;font:inherit;color:inherit;text-align:right}
.tile img,.tile .ph{width:100%;height:84px;object-fit:cover;display:block;background:var(--bg)}
.tile div{padding:8px}
.tile b{display:block;font-weight:600;font-size:14px}
.tile small{color:var(--mut)}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin:10px 0 4px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg .chip{flex:1}
@media print{body>*:not(#dlg){display:none!important}dialog{box-shadow:none;width:100%}.noprint{display:none!important}}
.tb{min-height:84px;border-radius:14px;border:2px solid var(--ok);background:var(--sf);font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tb b{font-size:26px;font-weight:800}
.tb small{font-size:12px}
.tb.busy{background:var(--ac);border-color:var(--ac);color:var(--act)}
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
main.w{max-width:1100px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
body.posmode{padding-bottom:0}
body.posmode header,body.posmode nav,body.posmode footer{display:none!important}
body.posmode main{max-width:none;padding:0}
.posf{display:block;min-height:100vh;background:var(--bg)}
.pbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--br);color:var(--brt)}
.pbar .chip{background:rgba(255,255,255,.16);color:inherit;border-color:transparent;white-space:nowrap}
.pbar .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.pbar input{flex:2;max-width:240px;min-height:38px;padding:6px 10px}
.pleft .pg{padding:12px;padding-bottom:96px;margin:0}
.pg.cats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ctile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:132px;border-radius:18px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;cursor:pointer;padding:12px}
.ctile .cic{font-size:46px;line-height:1}.ctile b{font-size:16px}.ctile small{color:var(--mut)}
.tile{position:relative}.tile .ph{display:grid!important;place-items:center;font-size:36px}
.tile.off{opacity:.5}
.qb{position:absolute;top:6px;inset-inline-start:6px;background:var(--ac);color:var(--act);border-radius:10px;font-style:normal;font-weight:800;font-size:13px;padding:1px 9px}
.sb{display:inline-block;margin-top:4px;font-style:normal;font-size:11px;padding:1px 8px;border-radius:8px}
.sb.ok{background:rgba(31,122,85,.16);color:var(--ok)}.sb.lo{background:rgba(224,149,26,.22);color:var(--ac)}.sb.no{background:rgba(179,38,30,.16);color:var(--dg)}
.tg{position:absolute;top:6px;inset-inline-end:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:8px}
.pcartbar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ac);color:var(--act);border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:800;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:6;cursor:pointer}
.pcartbar:disabled{background:var(--ln);color:var(--mut);box-shadow:none}
.cbn{background:var(--act);color:var(--ac);border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.psheet{display:none}
.psheet.open{display:block;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.cph{display:flex;align-items:center;gap:10px;margin-bottom:10px}.cph h2{margin:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.tbn{min-height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.tbn.busy{border-color:var(--ac);background:rgba(224,149,26,.18)}.tbn.sel{background:var(--br);color:var(--brt);border-color:var(--br)}
.isum{color:var(--mut);font-size:13px;margin-top:2px;white-space:normal;line-height:1.5}
.item.inv .nm small{display:block}
@media(min-width:900px){.posf{display:grid;grid-template-columns:1fr 400px;height:100vh}.pleft{overflow:auto}.psheet{display:block!important;position:static!important;border-inline-start:1px solid var(--ln);height:100vh;overflow:auto;padding:12px;background:var(--sf)}.pcartbar{display:none}.cph .chip{display:none}}
footer{max-width:760px;margin:0 auto;padding:6px 16px 18px;text-align:center;color:var(--mut);font-size:12px}footer a{color:inherit;text-decoration:underline}

<body>
<header><h1 id="nm">CAFÉ ONE</h1><p>نظام إدارة الكافتيريا</p><p id="who" style="margin-top:4px"></p></header>
<main id="main"></main>
<footer>برمجة د. عبدالله صالح · <a href="https://wa.me/963957767951" target="_blank" rel="noopener">واتساب <bdi dir="ltr">+963 957 767 951</bdi></a><br>© 2026 جميع الحقوق محفوظة</footer>
<nav>
<button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>الرئيسية</button>
<button data-v="pos"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h9.5l2-8H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>البيع</button>
<button data-v="tables"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>الطاولات</button>
<button data-v="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>الفواتير</button>
<button data-v="cash"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>الصندوق</button>
<button data-v="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>المزيد</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast" popover="manual"></div>
<script>
const KEY="cafeone_v1",$=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(x,d=0)=>Number(x).toLocaleString("en-US",{maximumFractionDigits:d});
const def=()=>{const c=["hot","cold","sweet","food"].map(k=>({id:k,n:{hot:"مشروبات ساخنة",cold:"مشروبات باردة",sweet:"حلويات",food:"مأكولات"}[k]}));
const p=(n,c,x)=>({id:uid(),n,c,p:x});
return{v:1,s:{name:"CAFÉ ONE",syp:13000,try:42,tables:12,sham:""},cats:c,
prods:[p("إسبريسو","hot",1.5),p("كابتشينو","hot",2),p("شاي","hot",1),p("عصير برتقال","cold",2.5),p("كيك شوكولا","sweet",3),p("ساندويش جبنة","food",3)]}};
let db,view="home",cat="all",q="",warned=false,cart=[],ot="dine",tb=1,nt="",ds={t:"p",v:0},pimg="",curT=0,curO="",ofl="all";
function load(){try{const r=localStorage.getItem(KEY);db=r?JSON.parse(r):def()}catch(e){db=def()}db.orders=db.orders||[];db.n=db.n||1;db.shifts=db.shifts||[];db.exp=db.exp||[];db.sn=db.sn||1;["inv","sup","pur","waste","cnt"].forEach(k=>db[k]=db[k]||[]);mig()}
function save(){try{if(typeof sy!=="undefined"&&sy)push();localStorage.setItem(KEY,JSON.stringify(db))}catch(e){if(!warned){warned=true;toast("تعذّر الحفظ على هذا الجهاز. لا تُغلق الصفحة قبل أخذ نسخة احتياطية.")}}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");try{e.hidePopover();e.showPopover()}catch(x){}clearTimeout(toast.t);toast.t=setTimeout(()=>{e.classList.remove("on");try{e.hidePopover()}catch(x){}},2600)}
const usd=x=>"$"+num(x,2),syp=x=>num(x*db.s.syp)+" ل.س",tr=x=>num(x*db.s.try,1)+" ₺";
const PH=["الأساس والمنتجات والإعدادات","نقطة البيع","الطاولات","الصندوق والمصروفات","المخزون والوصفات","العملاء والموظفون","التقارير","إكسل والمزامنة والطباعة","الاختبار النهائي"];

function render(){
 const nv=document.querySelector("nav");
 if(db.emp.length&&!me()){lock();return}
 if(!okv(view))view="home";
 nv.style.display="";nv.querySelectorAll("button").forEach(b=>b.style.display=okv(b.dataset.v)?"":"none");
 $("#who").innerHTML=me()?esc(me().n)+' · <button class="chip" data-a="logout" style="padding:2px 10px;font-size:12px">خروج</button>':"";
 $("#nm").textContent=db.s.name;document.body.classList.toggle("posmode",view==="pos");if(view!=="pos")lastView=view;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===(MORE.includes(view)?"more":view)));
 $("#main").innerHTML=view==="home"?home():view==="pos"?posView():view==="tables"?tablesView():view==="orders"?ordsView():view==="cash"?cashView():view==="exp"?expView():view==="more"?moreView():view==="inv"?invView():view==="buy"?buyView():view==="rec"?recView():view==="cus"?cusView():view==="rep"?repView():view==="help"?helpView():view==="link"?linkView():view==="emp"?empView():view==="products"?prodsView():setView();
 if(view==="products")list();
 if(view==="pos"){grid();cartUp()}
 $("#main").classList.toggle("w",view==="kitchen");
}
function home(){
 const m=dayS(0),T=db.orders.filter(o=>o.paid&&pt(o)>=m),v=sum(T),x=db.exp.filter(e=>e.at>=m).reduce((a,e)=>a+e.amt,0),top=prodStats(T).slice(0,5),bus=new Set(db.orders.filter(o=>o.type==="dine"&&!o.paid).map(o=>o.table)).size;
 return bkBar()+lowBar()+opBar()+`<div class="grid"><div class="stat"><b>${usd(v)}</b><span>مبيعات اليوم</span></div><div class="stat"><b>${T.length}</b><span>طلب مدفوع</span></div><div class="stat"><b>${usd(v-x)}</b><span>الصافي قبل تكلفة المواد</span></div><div class="stat"><b>${bus}/${db.s.tables}</b><span>طاولات مشغولة</span></div></div>
 <div class="card"><h2>آخر 7 أيام</h2>${bars(7)}</div>
 <div class="card"><h2>الأكثر مبيعاً اليوم</h2>${top.length?top.map(r=>row(esc(r.n)+" × "+num(r.q,0),usd(r.v))).join(""):'<div class="empty">لا مبيعات اليوم بعد.</div>'}</div>
 <button class="item" data-a="go" data-id="help"><div class="nm"><b>دليل الاستخدام</b><small>خطوات التشغيل اليومي والمزامنة والنسخ الاحتياطي</small></div><span>‹</span></button>`}
function prodsView(){
 return `<div class="bar"><input id="q" type="search" placeholder="ابحث عن منتج" value="${esc(q)}"><button class="btn ac" data-a="addp">+ منتج</button></div>
 <div class="chips"><button class="chip ${cat==="all"?"on":""}" data-a="cat" data-id="all">الكل</button>${db.cats.map(c=>`<button class="chip ${cat===c.id?"on":""}" data-a="cat" data-id="${c.id}">${esc(c.n)}</button>`).join("")}<button class="chip add" data-a="addcat">+ تصنيف</button></div>
 ${cat!=="all"?`<button class="chip" data-a="editcat" style="margin-bottom:10px">تعديل هذا التصنيف</button>`:""}<div id="list"></div>`}
function list(){
 const cn=id=>(db.cats.find(c=>c.id===id)||{n:"—"}).n;
 const r=db.prods.filter(p=>(cat==="all"||p.c===cat)&&p.n.includes(q.trim()));
 $("#list").innerHTML=r.length?r.map(p=>`<button class="item" data-a="editp" data-id="${p.id}">${p.i?`<img class="th" src="${p.i}" alt="">`:""}<div class="nm"><b>${esc(p.n)}</b><small>${esc(cn(p.c))}${sizeSum(p)}${stockTxt(p)}</small></div><div class="pr"><b>${usd(p.p)}</b><small>${syp(p.p)} · ${tr(p.p)}</small></div></button>`).join(""):`<div class="empty">لا توجد منتجات هنا.<br>اضغط «+ منتج» لإضافة أول منتج.</div>`}
function setView(){
 const s=db.s;
 return `<div class="card"><h2>بيانات الكافتيريا</h2>
 <label>اسم الكافتيريا<input id="s_name" value="${esc(s.name)}"></label>
 <label>سعر الدولار بالليرة السورية<input id="s_syp" type="number" inputmode="decimal" value="${s.syp}"></label>
 <label>سعر الدولار بالليرة التركية<input id="s_try" type="number" inputmode="decimal" value="${s.try}"></label>
 <label>عدد الطاولات<input id="s_tables" type="number" inputmode="numeric" value="${s.tables}"></label>
 <label>رمز حساب الشام كاش<input id="s_sham" value="${esc(s.sham)}"></label>
 <label>حجم ورق الطباعة<select id="s_pw">${[["80","حراري 80mm"],["58","حراري 58mm"],["A4","A4"]].map(x=>`<option value="${x[0]}"${(s.pw||"80")===x[0]?" selected":""}>${x[1]}</option>`).join("")}</select></label>
 <button class="btn" data-a="saveset">حفظ الإعدادات</button></div>
 
 <div class="card"><h2>النسخ الاحتياطي وExcel</h2>
 <div class="row"><button class="btn ac" data-a="bkf">حفظ نسخة كاملة</button><button class="btn" data-a="xls">تصدير كل البيانات (Excel)</button></div>

function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    var b = JSON.parse(e.postData.contents);

    var key = P.getProperty("K");

      P.setProperty("K", key);
    }
    if (String(b.k) !== key) return out({ err: "key" });

    var ss = SpreadsheetApp.getActiveSpreadsheet();

    if (b.dump) {
      b.dump.forEach(function (t) {
        var name = "DB " + t[0];
        var sh = ss.getSheetByName(name) || ss.insertSheet(name);
        sh.clear();
        var rows = t[1];
        var w = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 1);
        var data = rows.map(function (r) {
          var x = r.map(function (v) {
            return (typeof v === "string" && /^[=+\-@]/.test(v)) ? "'" + v : v;
          });
          while (x.length < w) x.push("");
          return x;
        });
        if (data.length) {
          sh.getRange(1, 1, data.length, w).setValues(data);
          sh.getRange(1, 1, 1, w).setFontWeight("bold");
          sh.setFrozenRows(1);
        }
        sh.setRightToLeft(true);
      });
      return out({ ok: 1, url: ss.getUrl() });
    }

    var sh2 = ss.getSheetByName("sync");
    if (!sh2) {
      sh2 = ss.insertSheet("sync");
      sh2.appendRow(["id", "su", "del", "json"]);
    }
    var data2 = sh2.getDataRange().getValues();
    var idx = {};
    for (var i = 1; i < data2.length; i++) idx[data2[i][0]] = i + 1;
    var now = Date.now();
    (b.items || []).forEach(function (it) {
      var row = [it.id, now, it.del ? 1 : 0, it.del ? "" : it.j];
      if (idx[it.id]) sh2.getRange(idx[it.id], 1, 1, 4).setValues([row]);
      else { sh2.appendRow(row); idx[it.id] = sh2.getLastRow(); }
    });
    var since = +b.since || 0;
    var rows2 = [];
    var d3 = sh2.getDataRange().getValues();

      if (+d3[k][1] > since) rows2.push({ id: d3[k][0], su: +d3[k][1], del: !!d3[k][2], j: d3[k][3] });
    }
    return out({ ok: 1, now: now, rows: rows2, url: ss.getUrl() });
  } finally {
    lock.releaseLock();
  }
}

function fbEv(e){

 if(m.path==="/"){if(m.data)Object.keys(m.data).forEach(id=>{ch=fbRow(id,m.data[id])||ch})}
 else if(m.path.indexOf("/",1)<0)ch=fbRow(m.path.slice(1),m.data);

async function fbTick(){

 try{const r=await fetch(fbUrl()+"/rows.json",{method:"PATCH",body:JSON.stringify(body)});if(!r.ok)throw 0;syMsg("متصل · "+new Date().toLocaleTimeString("en-GB"))}
 catch(e){outbox=items.concat(outbox);syMsg("لا يوجد اتصال. ستُعاد المحاولة تلقائياً")}

  Object.assign(db.s,{fb:u,fk:k,gs:"",gk:"",main:true,sync:true,su:""});save();stopSync();startSync();render();toast("تم الربط بنجاح")}
 catch(e){toast("تعذّر الاتصال. تأكد من الرابط ومن نشر القواعد")}}

function mvCard(from){
 if(!db.inv.length)return"";
 const rows=db.inv.map(m=>{let inn=0,sold=0,w=0,adj=0;moves(m.id).forEach(x=>{if(x.at<from)return;if(x.t==="شراء")inn+=x.d;else if(x.t==="بيع")sold-=x.d;else if(x.t.indexOf("هدر")===0)w-=x.d;else adj+=x.d});return{m,inn,sold,w,adj}}).filter(r=>r.inn||r.sold||r.w||r.adj);
 return `<div class="card"><h2>حركة المخزون</h2>${rows.length?rows.map(r=>`<div class="line"><div style="flex:1"><b>${esc(r.m.n)}</b><br><small style="color:var(--mut)">وارد ${num(r.inn,2)} · مبيع ${num(r.sold,2)} · هدر ${num(r.w,2)}${r.adj?" · تسوية "+num(r.adj,2):""} ${esc(r.m.u)}</small></div><b>${num(r.m.q,2)}</b></div>`).join(""):'<div class="empty">لا حركة بهذه الفترة.</div>'}</div>`}
